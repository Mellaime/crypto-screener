name: Daily screener pipeline

# Runs the full pipeline (discover -> filter -> save -> drop -> rank ->
# holders -> score) once a day against Supabase. GitHub Actions has no short
# time limit like Vercel functions, so the rate-limited pipeline runs fine.
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC every day
  workflow_dispatch: {}    # also lets you run it manually from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # STOPGAP: runs currently take ~60-80+ min (drop_logic re-checks and
    # rank_check scale with the active + dropped lists). Raised from 60 so a
    # run isn't killed half-way; revisit once the per-coin daily checks are
    # budgeted within CoinGecko's free quota.
    timeout-minutes: 120
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run the pipeline once
        working-directory: backend
        env:
          # These come from the repo's Actions secrets (Settings -> Secrets).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}   # step 7 liquidity trend
          # Daily Telegram report (daily_report.py); missing -> report skipped.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Upcoming Unlocks (dropstab.py); missing -> that step is skipped.
          DROPSTAB_API_KEY: ${{ secrets.DROPSTAB_API_KEY }}
          # Futures Data (coinalyze.py); missing -> that step is skipped.
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          # 3-source liquidity verification (birdeye.py); missing -> every
          # Birdeye reading counts as failed (no liquidity decision needing it).
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          # Burned supply (burn_detector.py); missing -> Etherscan chains are
          # skipped (public-RPC chains still update).
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: python scheduler.py --once
