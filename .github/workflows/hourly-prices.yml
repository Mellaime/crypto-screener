name: Hourly live prices

# Every hour on the hour: refresh coins.live_price / live_price_at for the
# active coins (backend/hourly_prices.py): CoinMarketCap first (~2 credits),
# DexScreener for coins CMC can't price, then Codex (~1 request), < 1 min.
# Touches nothing else - the daily pipeline owns every other field. The
# script always exits 0; it alerts on Telegram only if the run fails or
# fewer than half of the active coins were updated.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: hourly-prices
  cancel-in-progress: false

jobs:
  hourly-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Update live prices
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}   # primary live price
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}   # fallback for coins DexScreener can't price
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python hourly_prices.py
